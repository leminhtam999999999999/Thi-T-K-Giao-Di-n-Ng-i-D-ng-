<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng ký thành viên</title>
</head>
<body>

    <form action="#" name="dangky" method="post">
        <table align="center" width="450">
            <tr>
                <td align="center"><h2>ĐĂNG KÝ THÀNH VIÊN</h2></td>
            </tr>
            <tr>
                <td>
                    <!-- Khung Thông tin cá nhân -->
                    <fieldset>
                        <legend><b>Thông tin cá nhân</b></legend>
                        <table width="100%" cellpadding="5">
                            <tr>
                                <td width="100">Họ và tên:</td>
                                <td><input type="text" name="txtHoTen"></td>
                            </tr>
                            <tr>
                                <td>Ngày sinh:</td>
                                <td>
                                    <!-- Vòng lặp tự động tạo từ ngày 01 đến ngày 31 -->
                                    <select name="Ngay" id="selectNgay">
                                        <script>
                                            for (let i = 1; i <= 31; i++) {
                                                let value = i < 10 ? '0' + i : i;
                                                document.write(`<option value="${value}">${value}</option>`);
                                            }
                                        </script>
                                    </select>

                                    Tháng sinh:
                                    <!-- Vòng lặp tự động tạo từ tháng 01 đến tháng 12 -->
                                    <select name="Thang" id="selectThang">
                                        <script>
                                            for (let i = 1; i <= 12; i++) {
                                                let value = i < 10 ? '0' + i : i;
                                                document.write(`<option value="${value}">${value}</option>`);
                                            }
                                        </script>
                                    </select>

                                    Năm:
                                    <!-- Vòng lặp tự động lấy năm hiện tại lùi về trước hơn 20 năm -->
                                    <select name="txtNam" id="selectNam">
                                        <script>
                                            let namHienTai = new Date().getFullYear();
                                            // Tạo danh sách lùi về trước 40 năm tính từ năm hiện tại
                                            for (let i = namHienTai; i >= namHienTai - 40; i--) {
                                                document.write(`<option value="${i}">${i}</option>`);
                                            }
                                        </script>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>Giới tính:</td>
                                <td>
                                    <input type="radio" name="radGioiTinh" value="Nam" checked> Nam
                                    <input type="radio" name="radGioiTinh" value="Nữ"> Nữ
                                </td>
                            </tr>
                            <tr>
                                <td>Địa chỉ:</td>
                                <td><textarea name="txtDiaChi" rows="3" cols="30"></textarea></td>
                            </tr>
                            <tr>
                                <td>Điện thoại:</td>
                                <td><input type="tel" name="txtDienThoai"></td>
                            </tr>
                            <tr>
                                <td>Email:</td>
                                <td><input type="email" name="txtEmail" required></td>
                            </tr>
                        </table>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Khung Thông tin đăng nhập -->
                    <fieldset>
                        <legend><b>Thông tin đăng nhập</b></legend>
                        <table width="100%" cellpadding="5">
                            <tr>
                                <td width="100">Tên đăng nhập:</td>
                                <td><input type="text" name="txtUser" required></td>
                            </tr>
                            <tr>
                                <td>Mật khẩu:</td>
                                <td><input type="password" name="txtPass" required></td>
                            </tr>
                            <tr>
                                <td>Nhập lại m.khẩu:</td>
                                <td><input type="password" name="txtRePass" required></td>
                            </tr>
                        </table>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td align="center" style="padding-top: 10px;">
                    <input type="submit" value="Đăng ký">
                    <input type="reset" value="Hủy">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
