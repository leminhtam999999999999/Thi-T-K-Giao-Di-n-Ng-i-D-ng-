<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Nhà sách ABC - Trang Chủ Tổng Hợp</title>
</head>
<!-- ĐÃ SỬA: Thêm hình nền đồng cỏ cho toàn trang web, tự động căn giữa và phủ kín màn hình -->
<body style="font-family: Arial, sans-serif; margin: 0; padding: 10px; 
             background-image: url('Images/backgroud.png'); 
             background-size: cover; 
             background-position: center; 
             background-attachment: fixed; 
             background-repeat: no-repeat;">

    <!-- Khung Header đầu trang -->
    <header style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background-color: rgba(252, 252, 252, 0.9);">
        <iframe src="Header.html" width="100%" height="120" frameborder="0" scrolling="no"></iframe>
    </header>
 
    <!-- Khung Menu điều hướng -->
    <nav style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background-color: rgba(249, 249, 249, 0.9);">
        <iframe src="Nav.html" width="100%" height="130" frameborder="0" scrolling="no"></iframe>
    </nav>
 
    <!-- Phần thân của trang web chia làm 3 cột -->
    <div style="display: flex; gap: 10px; min-height: 500px;"> 
 
        <!-- Cột Bên Trái (Menu danh mục sách) -->
        <aside style="width: 25%; border: 1px solid #ccc; padding: 10px; background-color: rgba(255, 255, 255, 0.85);">
            <iframe src="Left.html" width="100%" height="100%" frameborder="0"></iframe>
        </aside>
 
        <!-- Cột Ở Giữa (Hiển thị nội dung chính/Sản phẩm) -->
        <section style="width: 50%; border: 1px solid #ccc; padding: 10px; background-color: rgba(255, 255, 255, 0.95);">
            <iframe src="Chitietsanpham.html" name="main-content" width="100%" height="100%" frameborder="0"></iframe>
        </section>
 
        <!-- Cột Bên Phải (Sách bán chạy chữ chạy lên) -->
        <aside style="width: 25%; border: 1px solid #ccc; padding: 10px; background-color: rgba(255, 255, 255, 0.85);">
            <iframe src="Right.html" width="100%" height="100%" frameborder="0"></iframe>
        </aside>

    </div>
 
    <!-- Khung Footer cuối trang -->
    <footer style="border: 1px solid #ccc; padding: 15px; margin-top: 10px; text-align: center; background-color: rgba(51, 51, 51, 0.9); color: white;">
        <p>©2016 - Nhà sách ABC. Allright Reserved</p>
        <p>Website được phát triển để sử dụng làm bài tập thực hành môn Thiết kế và Lập trình Web</p>
        <p>Email: VanLang.bookstore@gmail.com</p>
    </footer>

</body>
</html>
